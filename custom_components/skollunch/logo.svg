<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <radialGradient id="banner-bg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <linearGradient id="logo-grad-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow-banner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1000" height="320" rx="32" fill="url(#banner-bg)" />
  <rect width="998" height="318" x="1" y="1" rx="31" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Symbol till vänster -->
  <g transform="translate(170, 160) scale(2.8)">
    <g transform="translate(-50, -50)">
      <circle cx="50" cy="50" r="42" stroke="url(#logo-grad-banner)" stroke-width="3.5" fill="none" filter="url(#glow-banner)" />
      <circle cx="50" cy="50" r="32" stroke="url(#logo-grad-banner)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" fill="none" />
      <path d="M42 33v12c0 2-1.5 3.5-3.5 3.5H38.5c-2 0-3.5-1.5-3.5-3.5V33 M35 33v8 M42 33v8 M38.5 33v28" 
            stroke="url(#logo-grad-banner)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M58 33v28 M58 33c3.5 0 6 3 6 8v6h-6" 
            stroke="url(#logo-grad-banner)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M47 22c3-4 8-3 9 1-3 4-8 3-9-1z" fill="url(#logo-grad-banner)" />
    </g>
  </g>

  <!-- Typografi till höger -->
  <g transform="translate(340, 150)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
    <text x="0" y="0" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="1.5">
      SKOLLUNCH
    </text>
    <text x="350" y="0" font-size="52" font-weight="900" fill="url(#logo-grad-banner)" letter-spacing="1.5">
      HÄRNÖSAND
    </text>
    <text x="2" y="44" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      Officiell matsedel direkt i Home Assistant
    </text>
  </g>
</svg>
