<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bakgrundsgradient matching dark mode -->
    <radialGradient id="icon-bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Signaturgradient för bestick och cirklar -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Mjuk neon-glöd runt tallriken -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rundad bakgrundsplatta -->
  <rect width="512" height="512" rx="110" fill="url(#icon-bg)" />
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Logomotiv skalat och centrerat (Original 100x100 skalat x4.2) -->
  <g transform="translate(256, 256) scale(4.2)">
    <g transform="translate(-50, -50)">
      <!-- Yttre tallriksring med glöd -->
      <circle cx="50" cy="50" r="42" stroke="url(#logo-grad)" stroke-width="3.5" fill="none" filter="url(#glow)" />
      
      <!-- Inre streckad cirkelring -->
      <circle cx="50" cy="50" r="32" stroke="url(#logo-grad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" fill="none" />

      <!-- Gaffel -->
      <path d="M42 33v12c0 2-1.5 3.5-3.5 3.5H38.5c-2 0-3.5-1.5-3.5-3.5V33 M35 33v8 M42 33v8 M38.5 33v28" 
            stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Kniv -->
      <path d="M58 33v28 M58 33c3.5 0 6 3 6 8v6h-6" 
            stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Ångande doft/löv ovanför -->
      <path d="M47 22c3-4 8-3 9 1-3 4-8 3-9-1z" fill="url(#logo-grad)" />
    </g>
  </g>
</svg>
